name: ✨ Ideia / melhoria
description: Sugira uma funcionalidade ou abordagem técnica.
title: "[Ideia] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Qual problema isso resolve?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Proposta
      description: Como você imagina que funcionaria. Links para papers/SDKs são bem-vindos.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternativas consideradas
