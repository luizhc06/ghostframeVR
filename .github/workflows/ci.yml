name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  linux-tests:
    name: Testes (Linux, SteamVR simulado)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configurar
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
      - name: Compilar
        run: cmake --build build -j
      - name: Testar
        run: ctest --test-dir build --output-on-failure

  app-core:
    name: App (lógica, Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app
      - name: Testar
        working-directory: app
        run: cargo test

  windows-build:
    name: Build (Windows x64, MSVC)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configurar
        run: cmake -S . -B build -A x64
      - name: Compilar
        run: cmake --build build --config Release
      - name: Testar (frame gen no WARP)
        run: ctest --test-dir build -C Release --output-on-failure -E proxy_e2e
      # Saída inteira (-V): os números do frame gen ou o motivo do SKIP aparecem no log.
      - name: Testar ponta a ponta (proxy + Pico falso na GPU)
        run: ctest --test-dir build -C Release -V -R proxy_e2e
      - name: Conferir export HmdDriverFactory
        shell: pwsh
        run: |
          $dumpbin = Get-ChildItem "${env:ProgramFiles}\Microsoft Visual Studio" -Recurse -Filter dumpbin.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match 'Hostx64\\x64' } | Select-Object -First 1
          $out = & $dumpbin.FullName /exports build\Release\driver_ghostframe.dll
          $out
          if (-not ($out -match 'HmdDriverFactory')) { throw 'HmdDriverFactory não exportado' }
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app
      - name: Compilar app (DLL embutida)
        working-directory: app
        env:
          GF_PROXY_DLL: ${{ github.workspace }}\build\Release\driver_ghostframe.dll
        run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: ghostframeVR-${{ github.sha }}
          path: |
            build/Release/driver_ghostframe.dll
            app/target/release/ghostframeVR.exe
