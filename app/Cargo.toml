[package]
name = "ghostframevr"
version = "0.2.0-alpha"
edition = "2021"
publish = false

[[bin]]
name = "ghostframeVR"
path = "src/main.rs"

[dependencies]
serde_json = { version = "1", features = ["preserve_order"] }

# A janela só existe no Windows; no Linux compilamos só a lógica (cargo test).
[target.'cfg(windows)'.dependencies]
tauri = { version = "2", features = ["custom-protocol", "tray-icon"] }
tauri-plugin-single-instance = "2"

[build-dependencies]
tauri-build = "2"
cc = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
